name: Three.js visual QA captures

on:
  push:
    branches: [main]
    # Cover the UI this script actually drives, so a markup change that breaks
    # its selectors is caught here instead of silently going stale.
    paths:
      - .github/workflows/visual-qa.yml
      - scripts/visual-smoke.mjs
      - src/app/**
      - src/engine/**
      - src/content/**
      - src/styles/**
      - package-lock.json
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfile install only: the other two workflows use `npm ci`, and a
      # different install path here could drift from what they verify.
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build project
        run: npm run build
      - name: Install CJK fonts for accurate Chinese typography screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect Chromium binary
        run: which google-chrome || which chromium || which chromium-browser
      - name: Capture desktop and portrait Three.js frames
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/visual-smoke.mjs
      - name: Save review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs-camera-frames
          path: visual-qa/*.jpg
          retention-days: 7
          if-no-files-found: ignore
