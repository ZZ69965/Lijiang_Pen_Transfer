name: Painting behaviour QA

# Runs the main-painting regression (loading, snapshots, input ownership,
# fish market) on PRs and on changes to anything that can affect it.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/engine/**'
      - 'src/content/**'
      - 'src/styles/**'
      - 'tests/**'
      - 'scripts/behaviour-smoke.mjs'
      - 'scripts/drone-smoke.mjs'
      - 'public/art/night-drones-*.webp'
      - 'docs/drone-assets.json'
      - '.github/workflows/behaviour-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests (state machine, loading plan, viewport, guards)
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: CJK fonts for accurate screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Start preview server
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 80); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/Lijiang_Pen_Transfer/; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          # Never let a dead server look like a started one: the old loop simply
          # ended and the next step failed with a confusing browser error.
          echo "::error::preview server did not become ready within 80s"
          exit 1
      - name: Behaviour regression and screenshots
        env:
          CHROME_BIN: /usr/bin/google-chrome
          OUT_DIR: qa/ci
        run: node scripts/behaviour-smoke.mjs
      - name: Uploaded drone artwork regression and screenshots
        env:
          CHROME_BIN: /usr/bin/google-chrome
          OUT_DIR: qa/ci/night-drones
        run: npm run test:drones
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painting-behaviour
          path: qa/ci
          if-no-files-found: warn
